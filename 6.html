    <style>
        body {
            font-family: 'Khmer OS Battambang', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
            position: relative;
        }
        
        /* Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 5vw;
            color: #000;
            opacity: 0.06;
            z-index: 9999;
            pointer-events: none;
            white-space: nowrap;
            user-select: none;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        h2, h3 {
            text-align: center;
            color: #2c3e50;
        }
        .subtitle {
            text-align: center;
            color: #e67e22;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            width: 80%;
            max-width: 350px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
        }
        button {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        /* Exam Screen */
        #exam-screen, #result-screen {
            display: none;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            background: #ecf0f1;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
            color: #2c3e50;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #3498db;
        }
        .page-group {
            display: none;
        }
        .page-group.active {
            display: block;
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            transition: 0.3s;
        }
        .question-card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #34495e;
        }
        .options-list {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .options-list { grid-template-columns: 1fr; }
        }
        .options-list label {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options-list label:hover {
            background: #f1f2f6;
            border-color: #3498db;
        }
        .options-list input {
            margin-right: 15px;
            transform: scale(1.3);
            accent-color: #3498db;
        }
        
        /* Pagination Controls */
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #ecf0f1;
        }
        .page-indicator {
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Result Screen */
        .result-summary {
            text-align: center;
            padding: 30px;
            background: #f0f8ff;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #d6eaf8;
        }
        .score-display {
            font-size: 36px;
            font-weight: bold;
            color: #2980b9;
            margin: 15px 0;
        }
        .grade-display {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
        }
        .review-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .correct-bg { border-left: 5px solid #2ecc71; }
        .wrong-bg { border-left: 5px solid #e74c3c; }
        .unanswered-bg { border-left: 5px solid #f1c40f; }
